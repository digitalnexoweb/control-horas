name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Diagnose Cloudflare token permissions
        run: |
          echo "Token length: ${#CLOUDFLARE_API_TOKEN}"
          echo "--- /user/tokens/verify ---"
          curl -s "https://api.cloudflare.com/client/v4/user/tokens/verify" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | python3 -c "import sys,json; d=json.load(sys.stdin); print('success:',d.get('success')); [print('  ',e) for e in d.get('errors',[])]"
          echo "--- /accounts ---"
          curl -s "https://api.cloudflare.com/client/v4/accounts?per_page=1" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | python3 -c "import sys,json; d=json.load(sys.stdin); print('success:',d.get('success')); [print('  ',e) for e in d.get('errors',[])]"
          echo "--- /accounts/ID/workers/scripts ---"
          curl -s "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts?per_page=1" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | python3 -c "import sys,json; d=json.load(sys.stdin); print('success:',d.get('success')); [print('  ERROR:',e) for e in d.get('errors',[])]"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: dcc0d20b31d72697d08cceb304de76c4

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: dcc0d20b31d72697d08cceb304de76c4
